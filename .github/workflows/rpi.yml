name: Build RPI

on:
  push:
   branches:
      - "2.5-evo"
      - "dev-release"
      - "release"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: pguyot/arm-runner-action@45f370abd7eed1b20397277e5ec0cb0a31adb026
      id: build_image
      with:
        base_image: raspios_lite:2023-05-03
        image_additional_mb: 4000
        copy_repository_path: /opt
        copy_artifact_path: build_artifacts
        import_github_env: true
        commands: |
            set -e
            cd "/opt/$(basename "$GITHUB_REPOSITORY")"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
              libavcodec-dev libavformat-dev libavutil-dev libdrm-dev
            cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            cmake --build build --parallel 4
            sudo cmake --install build
            rm -Rf /opt/vc/src
            rm -Rf /opt/vc/man
            rm -Rf /opt/vc/include
            mkdir -p /opt/vc/usr/local/bin/
            mkdir -p /opt/vc/etc/systemd/system
            cp /opt/vc/bin/openhd_pi_vid /opt/vc/usr/local/bin/
            ln -sf openhd_pi_vid /opt/vc/usr/local/bin/fpv_video0.bin
            rm -Rf /opt/vc/bin
            mkdir -p /opt/vc/lib2/arm-linux-gnueabihf
            cp -r /opt/vc/lib/libopenmaxil.so /opt/vc/lib2/arm-linux-gnueabihf
            rm -Rf /opt/vc/lib
            mv /opt/vc/lib2/ /opt/vc/lib/
            LD_LIBRARY_PATH=/opt/vc/lib/arm-linux-gnueabihf \
              /opt/vc/usr/local/bin/openhd_pi_vid --supports-hevc
            install -d /opt/vc/DEBIAN
            revision=$(printf '%.8s' "$GITHUB_SHA")
            printf '%s\n' \
              'Package: openhd-userland' \
              "Version: 3.0-evo-$(date -u '+%m%d%H%M')+$revision" \
              'Architecture: armhf' \
              'Maintainer: OpenHD' \
              'Depends: libraspberrypi0, libavcodec58, libavformat58, libavutil56' \
              'Description: OpenHD Raspberry Pi userland and video player' \
              > /opt/vc/DEBIAN/control
            install -m 0755 after-install.sh /opt/vc/DEBIAN/postinst
            install -d /opt/build_artifacts
            dpkg-deb --build --root-owner-group /opt/vc /opt/build_artifacts/openhd-userland.deb

    - name: Upload to Github
      uses: 'actions/upload-artifact@v4'
      with:
        name: "userland"
        path: |
          build_artifacts/*.deb
        if-no-files-found: error

    - name: Push
      id: push
      uses: cloudsmith-io/action@master
      with:
        api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
        command: "push"
        format: "deb"
        owner: "openhd"
        repo: dev-release
        distro: "raspbian"
        release: "bullseye"
        republish: "true" # needed ONLY if version is not changing
        file: "build_artifacts/*.deb"
          
