name: Build RPI

on:
  push:
    branches: [ master,"rapha-test", "2.0", "2.2.3-evo", "2.2.3-evo-rapha" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        overprovision-lvm: 'true'
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - uses: pguyot/arm-runner-action@v2
      id: build_image
      with:
        base_image: raspios_lite:latest
        image_additional_mb: 4000
        copy_repository_path: /opt
        copy_artifact_path: userland
        import_github_env: true
        commands: |
            ls -a
            cd /opt
            cd userland
            sudo apt update
            bash install_dep.sh
            mkdir build
            cd build
            cmake ..
            make -j4
            sudo make install
            cd ..
            rm -Rf /opt/vc/src
            rm -Rf /opt/vc/man
            rm -Rf /opt/vc/include
            mkdir -p /opt/vc/usr/local/bin/
            cp -r /opt/vc/bin/hello_video.bin /opt/vc/usr/local/bin/
            rm -Rf /opt/vc/bin
            mkdir -p /opt/vc/lib2/arm-linux-gnueabihf
            cp -r /opt/vc/lib/libopenmaxil.so /opt/vc/lib2/arm-linux-gnueabihf
            rm -Rf /opt/vc/lib
            mv /opt/vc/lib2/ /opt/vc/lib/
            fpm -a armhf -s dir -t deb -n userland -v 2.3-evo-$(date '+%m%d%H%M') -C /opt/vc -p userland.deb --after-install after-install.sh
            ls -a

    - name: Upload to Github
      uses: 'actions/upload-artifact@v2'
      with:
        name: "userland"
        path: |
          userland/*.deb
        if-no-files-found: error

    - name: Push
      id: push
      uses: cloudsmith-io/action@master
      with:
        api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
        command: "push"
        format: "deb"
        owner: "openhd"
        repo: "openhd-2-3-evo"
        distro: "raspbian"
        release: "bullseye"
        republish: "true" # needed ONLY if version is not changing
        file: "userland/*.deb"
          
